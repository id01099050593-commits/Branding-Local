<style>
/* Layout: an answer sheet — one question card at a time on ruled paper, red-pen feedback underneath; home is a curriculum ladder */
:root {
  --paper: #F4F6F8;
  --sheet: #FFFFFF;
  --ink: #17202B;
  --muted: #5D6876;
  --rule: #DDE3EA;
  --accent: #1F4FA8;
  --accent-soft: #E3EBF8;
  --ok: #1D7A46;
  --ok-soft: #E2F3E8;
  --pen: #C8302B;
  --pen-soft: #FBE7E5;
  --warn: #9A6A00;
  --warn-soft: #FBF1D9;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-pen: "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141A; --sheet: #171E26; --ink: #E5EAF0; --muted: #98A4B3; --rule: #2A3440;
    --accent: #7FA7EE; --accent-soft: #1C2A44; --ok: #5FCB8B; --ok-soft: #173426;
    --pen: #F07A72; --pen-soft: #3A1E1D; --warn: #E3B64C; --warn-soft: #362C14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141A; --sheet: #171E26; --ink: #E5EAF0; --muted: #98A4B3; --rule: #2A3440;
  --accent: #7FA7EE; --accent-soft: #1C2A44; --ok: #5FCB8B; --ok-soft: #173426;
  --pen: #F07A72; --pen-soft: #3A1E1D; --warn: #E3B64C; --warn-soft: #362C14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 22px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: grid; gap: 14px; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 24px; }
.dday { font-family: var(--f-mono); font-size: 13px; color: var(--pen); border: 1px solid var(--pen); border-radius: 4px; padding: 1px 6px; }
.sub { font-size: 13px; color: var(--muted); }
.meter { display: grid; gap: 6px; }
.meter-bar { height: 10px; border-radius: 99px; background: var(--rule); overflow: hidden; display: flex; }
.meter-bar span { display: block; height: 100%; }
.mb-done { background: var(--ok); }
.mb-half { background: var(--warn); }
.meter-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }

/* home */
.how { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; font-size: 13.5px; }
.how b { color: var(--accent); }
.ladder { display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.step-no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: center; }
.step-no b { display: block; font-size: 20px; color: var(--ink); }
.step-body { min-width: 0; display: grid; gap: 4px; }
.step-title { font-weight: 700; }
.step-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-bar { height: 5px; border-radius: 99px; background: var(--rule); overflow: hidden; display: flex; }
.step.done { border-color: var(--ok); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--sheet); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.btn.pen { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.special { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.special .step { grid-template-columns: 1fr auto; }
.sec-label { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.reset { justify-self: start; font-size: 12.5px; color: var(--muted); background: none; border: 0; text-decoration: underline; padding: 0; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }

/* quiz */
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }
.qhead-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.back { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; color: var(--ink); font-size: 13px; }
.qstage { font-weight: 700; font-size: 14px; }
.qleft { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 18px; display: grid; gap: 16px;
  border-top: 4px solid var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.chip.t-w { background: var(--warn-soft); color: var(--warn); }
.chip.t-x { background: var(--pen-soft); color: var(--pen); }
.chip.box { background: transparent; border: 1px solid var(--rule); color: var(--muted); font-weight: 500; }
.qtext { font-size: 18px; font-weight: 500; line-height: 1.6; background: var(--sheet); }
.qtext small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 4px; }
.answer { width: 100%; border: 1.5px solid var(--rule); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 16px; background: var(--sheet); color: var(--ink); resize: vertical; }
textarea.answer { min-height: 110px; line-height: 1.6; }
.answer.essay { min-height: 200px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { font-size: 12.5px; color: var(--muted); }

/* feedback */
.fb { border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; border: 1.5px solid var(--rule); background: var(--sheet); }
.fb.right { border-color: var(--ok); }
.fb.wrong { border-color: var(--pen); }
.verdict { font-family: var(--f-pen); font-size: 34px; line-height: 1; }
.fb.right .verdict { color: var(--ok); }
.fb.wrong .verdict { color: var(--pen); }
.fb-row { display: grid; gap: 4px; }
.fb-k { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.fb-ans { font-weight: 700; font-size: 16px; }
.mem { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.mem b { color: var(--accent); }
.yours { font-size: 13.5px; color: var(--muted); }
.yours s { color: var(--pen); }
.kp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kp li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 14px; align-items: start; }
.kp .mk { font-weight: 700; text-align: center; border-radius: 4px; }
.kp .hit .mk { color: var(--ok); }
.kp .miss .mk { color: var(--pen); }
.kp .miss { color: var(--muted); }
.model { font-size: 14.5px; border-left: 3px solid var(--accent); padding-left: 12px; }
.selfgrade { display: grid; gap: 8px; }
.selfgrade p { font-size: 13.5px; }

/* summary */
.sum { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 18px; display: grid; gap: 14px; }
.sum-big { font-family: var(--f-pen); font-size: 44px; line-height: 1; color: var(--accent); }
.sum-list { display: grid; gap: 6px; font-size: 14px; }
.sum-list div { display: grid; grid-template-columns: 1fr auto; gap: 8px; border-bottom: 1px dashed var(--rule); padding-bottom: 6px; }
@media (max-width: 480px) {
  .step { grid-template-columns: 36px 1fr; }
  .step .btn { grid-column: 1 / -1; justify-self: stretch; }
  .special .step { grid-template-columns: 1fr; }
  .qtext { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fb { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

const STAGES = [

const Q = [
/* ---------- 1. 로컬과 커뮤니티 (2차시) ---------- */
{ s:1,t:"s",q:"로컬을 해석하는 4가지 관점(권역)을 모두 쓰시오.",
  g:[["생활권"],["상권"],["문화권"],["관계권"]], a:"생활권 · 상권 · 문화권 · 관계권",
  e:"행정구역만이 로컬이 아니다. 일상 반복(생활권), 소비 중심(상권), 취향 공유(문화권), 사람과의 관계(관계권)로 로컬을 해석한다. 공식 분류가 아니라 해석의 관점이며, 한 장소가 한 칸에 고정되지 않는다.",
  m:"두 축: 세로 = 얼마나 자주 가나, 가로 = 얼마나 좋아하나. <b>단골 = 관계권, 성지 = 문화권</b>" },

  m:"자주 + 좋아함 = <b>단골</b> = 관계권" },
{ s:1,t:"s",q:"방문 빈도는 낮지만 취향의 강도가 높은 로컬 권역은?",
  g:[["문화권"]], a:"문화권",
  e:"가끔 가지만 강하게 좋아하는 곳. 취향·상징·분위기가 공유되는 범위. 예: 독립서점, 음악바, 서핑 스폿, 성지 같은 장소.",

{ s:1,t:"s",q:"생활인구 = 등록인구 + (    )",

  e:"등록인구는 주소를 두고 사는 사람, 체류인구는 와서 일하고 쇼핑하고 구경하는 사람. 인구감소지역에서 체류인구는 등록인구의 약 4.3배.",
  m:"사는 사람은 못 늘려도 <b>오는 사람</b>은 늘릴 수 있다" },
{ s:1,t:"s",q:"체류인구 산정 기준: 월 (  )회 이상, 하루 (  )시간 이상 체류. 두 숫자를 쓰시오.",
  g:[["1"],["3"]], a:"월 1회, 하루 3시간",
  e:"행정안전부·국가데이터처 생활인구 산정 기준. 한 달에 한 번 이상, 3시간 이상 머문 사람을 체류인구로 본다.",

  g:[["resource","자원"],["people","사람"],["experience","경험"],["story","이야기","스토리"],["repeat","반복"]],
  a:"RESOURCE · PEOPLE · EXPERIENCE · STORY · REPEAT (자원 · 사람 · 경험 · 이야기 · 반복)",

  g:[["join","가입"],["participate","참여"],["contribute","기여"],["belong","소속"]],
  a:"JOIN → PARTICIPATE → CONTRIBUTE → BELONG (가입 → 참여 → 기여 → 소속)",
  e:"커뮤니티는 사람들이 반복해서 만나며 서로에게 기여하고, 그 안에서 역할과 가치를 키워가는 관계 구조다.",

  g:[["why","존재이유","이유","왜"],["who","참여자","누구"],["do","활동"],["rule","규칙","문화"],["role","역할"]],
  a:"WHY · WHO · DO · RULE · ROLE (존재이유 · 명확한 참여자 · 반복 가능한 활동 · 규칙과 문화 · 기여할 역할)",

{ s:1,t:"s",q:"'이름을 불러주었을 때 꽃이 되었다'는 구절로 브랜드가 되는 순간을 설명한 시와 시인은?",
  g:[["꽃"],["김춘수"]], a:"김춘수 「꽃」",
  e:"어떤 지역에든 원래 자원이 있다. 누군가 의미를 해석하고, 사람들이 경험하고, 이야기가 생기고, 그곳을 부르길 반복할 때 브랜드가 된다. 5차시 '브랜드는 이름에 붙은 의미'와 연결.",
  m:"이름을 불러준다 = <b>의미를 붙인다</b> = 브랜딩" },
{ s:1,t:"w",q:"모임과 커뮤니티의 차이를 2가지 이상의 기준으로 설명하시오.",
  k:[["반복성: 모임은 없어도 되고 커뮤니티는 중요",["반복"]],["관계: 모임은 끝나고 커뮤니티는 누적",["누적","관계"]],["역할: 참가자 vs 기여자·운영자",["역할","기여","참가자"]],["규칙·문화가 생김",["규칙","문화"]],["다시 만날 이유",["다시"]]],
  model:"모임은 한 번 만나도 성립하고 목적이 끝나면 흩어지지만, 커뮤니티는 다시 만날 이유가 있어 반복되고 관계가 누적된다. 또 모임의 구성원은 참가자에 머물지만, 커뮤니티의 구성원은 기여자·운영자로서 역할을 갖고 규칙과 문화가 자연스럽게 생긴다.",
  e:"비교 기준 9개(시작 이유·반복성·지속성·관계·역할·규칙·소속감·얻는 것·다음 모임) 중 2개 이상을 대비해서 쓰면 된다.",
  m:"<b>모임은 일정이 중심, 커뮤니티는 관계가 중심</b>. 커뮤니티엔 '우리'라는 말이 생긴다" },
{ s:1,t:"w",q:"'로컬은 행정구역보다 생활의 범위에 가깝다'는 말의 의미를 쓰시오.",
  k:[["행정구역 경계가 아님",["행정"]],["이동·만남·소비·기억",["이동","만나","소비","기억"]],["반복되는 관계",["반복","관계"]]],
  model:"로컬은 주소지 같은 행정구역의 경계가 아니라, 사람들이 목적을 갖고 이동해서 만나고, 소비하고, 기억을 쌓는 생활의 범위다. 같은 길을 걷고 같은 가게를 찾고 같은 사람을 반복해서 만나는 그 반복이 '로컬'이라는 감각을 만든다.",
  e:"정의 문장(이동·만남·소비·기억)과 '반복이 로컬을 만든다'를 함께 쓰면 완성.",
  m:"로컬 = <b>장소 + 반복되는 관계</b>" },
{ s:1,t:"w",q:"지자체가 로컬(로컬 크리에이터)을 지원하는 이유를 흐름으로 설명하시오.",
  k:[["인구소멸 대응",["인구"]],["생활인구(방문·체류) 증가",["생활인구","체류","방문"]],["상권·지역경제 활성화",["상권","경제"]],["지속가능한 활동 구조",["지속"]]],
  model:"인구소멸에 대응해 사람이 들어와 살게 하기 위해서다. 청년 창업이 빈 공간과 지역자원을 재발견해 새 상점·콘텐츠를 만들면 생활인구(방문과 체류)가 늘고, 상권과 지역경제가 살아나 살아보고 싶은 마음이 생긴다. 목표는 예쁜 가게 몇 개가 아니라 지속가능한 활동 구조다.",
  e:"청년 창업 → 자원 재발견 → 새 콘텐츠 → 생활인구 증가 → 상권 활성화 → 살아보고 싶은 마음. 마지막 문장 '지속가능한 활동 구조'가 핵심.",
  m:"지원의 목표 = <b>예쁜 가게 몇 개가 아니라 지속가능한 구조</b>" },
{ s:1,t:"w",q:"'바다가 있다고 모두 서핑도시가 되지는 않는다'는 말을 양양 사례로 설명하시오.",
  k:[["자원보다 해석",["해석"]],["사람(크리에이터)",["사람","크리에이터","서퍼"]],["서핑 라이프·문화",["라이프","문화"]]],
  model:"동해안 어디에나 바다가 있지만 양양만 서핑도시가 된 것은, 바다를 '서핑 라이프'로 해석한 사람들 때문이다. 토끼굴에서 시작한 서퍼들이 죽도에서 서핑샵을 늘리고 문화를 만들었다. 즉 양양의 자원은 바다가 아니라 바다를 해석한 사람들이었다.",
  e:"공식: 자연자원 + 크리에이터 + 콘텐츠 + 문화. 흐름: 방문 → 체험 → 체류 → 재방문 → 관계.",
  m:"<b>자원 그 자체보다, 자원을 해석한 사람</b>" },
{ s:1,t:"x",q:"성수동이 개성 있는 로컬로 자리 잡은 과정을 로컬 4권역(생활권·상권·문화권·관계권) 관점에서 서술하시오.",
  k:[["시작은 공장 생활권",["공장","생활권"]],["문화권 형성(힙해짐)",["문화권","힙"]],["상권 확대",["상권"]],["생활권 확대(회사·거주)",["회사","직장","거주"]],["관계권 강화",["관계권"]],["권역이 서로를 키움",["순환","서로","상호"]]],
  model:"성수동은 자동차공업사·구두공장과 식당 몇 개의 작은 생활권에서 출발했다. 부동산 개발로 노동자와 패션피플이 섞이며 낡은 골목이 힙해지자 문화권이 형성됐고, 문화권이 '가볼 이유'를 만들자 카페·편집숍이 들어오며 상권이 커졌다. 상권이 커지자 회사와 거주 인구가 유입돼 생활권이 넓어졌고, 주민·단골·창작자의 관계권이 강화되어 재방문과 추천이 늘었다. 이처럼 네 권역이 서로를 키우는 순환 구조가 성수만의 개성을 만들었다. 경쟁력은 공장을 없애서가 아니라 공장이 남긴 풍경을 새롭게 해석한 데서 나왔다.",
  e:"8단계 메커니즘을 다 쓸 필요는 없고, '문화권 → 상권 → 생활권 → 관계권'의 순환 논리와 '해석'을 결론에 넣으면 된다.",
  m:"성수 = <b>4권역 순환의 교과서</b>. 문화가 가볼 이유를, 상권이 수요를, 생활권이 관계를 만든다" },

/* ---------- 2. 사례 (3차시) ---------- */
{ s:2,t:"s",q:"3차시 사례 분석의 핵심: 사례의 핵심은 '장소'가 아니라 장소를 통과하는 (     )이다.",
  g:[["흐름"]], a:"사람의 흐름",
  e:"사례는 예쁜 공간 소개가 아니라 관계 구조 분석이다. 누가 사람을 모으는지, 관계가 어디서 반복되는지, 돈과 명성이 어디로 퍼지는지를 읽는다.",
  m:"보이는 것(카페·건물·사진) 말고 <b>읽어야 할 것(사람·관계·돈)</b>" },
{ s:2,t:"s",q:"케이스를 읽는 프레임 7단계를 순서대로 쓰시오.",
  g:[["출발점"],["거점"],["플레이어"],["반복"],["인지","확산"],["수익"],["지역효과","효과"]],
  a:"출발점 → 핵심 거점 → 주요 플레이어 → 반복 활동 → 인지 확산 → 수익 구조 → 지역 효과",
  e:"어디서 시작했고, 어디가 중심이며, 누가 움직이고, 무엇이 반복되며, 어떻게 알려지고, 어떻게 돈을 벌고, 지역에 무엇을 남겼나.",
  m:"<b>출·거·플·반·인·수·효</b> → 출근길 거리에서 플레이하며 반복 인사하니 수익 효과" },
{ s:2,t:"s",q:"굿러너의 커뮤니티+비즈니스 선순환 5단계를 영어로 쓰시오.",
  g:[["run","그룹런"],["train","훈련"],["race","대회"],["media","콘텐츠"],["store","스토어"]],
  a:"RUN → TRAIN → RACE → MEDIA → STORE (그룹런 → 훈련 → 대회 → 콘텐츠 → 스토어)",
  e:"관계 형성 → 기술 성장 → 집단 기억 → 지식 공유 → 재방문. 매장이 다시 만남의 거점이 되어 처음(RUN)으로 돌아간다.",
  m:"<b>달리고 · 배우고 · 겨루고 · 나누고 · 산다</b>" },
{ s:2,t:"s",q:"굿러너 사례에서 커뮤니티는 사업 대상이 아니라 함께 문제를 발견하고 검증한 무엇이었나?",
  g:[["현장연구소","연구소"]], a:"현장 연구소",
  e:"달리며 맺은 관계가 고객조사·파트너 발굴·초기 신뢰를 동시에 만들었다. 커뮤니티를 고객이 아니라 동료이자 공동 기획자로 볼 때 성장한다.",
  m:"커뮤니티 = <b>고객 명단이 아니라 연구실</b>" },
{ s:2,t:"s",q:"굿러너가 반복 코스 한가운데 만든 응원 구역의 이름은?",
  g:[["허세존"]], a:"허세존",
  e:"대회를 경쟁이 아니라 다시 오고 싶은 축제로 바꾼 장치. 응원하는 사람도 경험의 공동 제작자다. 7인 릴레이, 피니시 돌봄, 마지막 주자까지 기다리기도 같은 장치.",
  m:"<b>허세 부리며 응원하는 존</b>" },
{ s:2,t:"s",q:"굿러너의 첫 상품은 장비가 아니라 무엇이었나? (예: 살로몬 트레일러닝 아카데미)",
  g:[["프로그램","아카데미","교육"]], a:"러너가 성장하는 과정을 설계한 프로그램",
  e:"입문 → 훈련 → 선발 → 대회의 학습 여정. 2016년 30명 모집에 약 500명 지원.",
  m:"<b>30명에 500명</b>, 팔린 건 신발이 아니라 성장 과정" },
{ s:2,t:"s",q:"개항로 사례에서 노포(오래된 가게)는 배경이 아니라 무엇인 셈인가?",
  g:[["공동저자","공동 저자"]], a:"공동저자",
  e:"노포·청년·장인·브랜드를 묶어 거리 생태계를 만들었다. 목간판 장인이 맥주 로고를, 영화벽화 작가가 포스터 모델이 되는 식으로 오래된 것에 새 역할을 줬다.",
  m:"노포 = <b>같이 책을 쓴 작가</b>" },
{ s:2,t:"s",q:"개항로가 인천의 부정적 별명을 뒤집어 만든 축제의 이름은?",
  g:[["마계인천"]], a:"마계인천 페스티벌",
  e:"거친 별명을 버리지 않고 '뭐든 가능한 도시'의 세계관으로 뒤집었다. 축제장을 따로 짓지 않고 기존 가게와 골목을 무대로 썼다.",
  m:"<b>약점을 세계관으로</b>" },
{ s:2,t:"s",q:"개항로가 거리 전체를 캠퍼스로 만든 교육 프로그램의 이름은?",
  g:[["마계대학"]], a:"마계대학",
  e:"크루와 노포 장인이 교수가 되고, 답사 → 강연 → 워크숍 → 오디션 → 소비자 테스트 → 졸업식. 교육이 끝나면 발표가 아니라 시장으로 간다. 다음 로컬 크리에이터를 배출하는 구조.",
  m:"마계인천(축제) + <b>마계대학(교육)</b> = 같은 세계관" },
{ s:2,t:"s",q:"개항로에서 공공(정부) 지원은 언제 붙었나?",
  g:[["민간","증명","이후","뒤"]], a:"민간 실험이 증명된 뒤 (출발점이 아니라 확장 장치)",
  e:"2017 민간 기획자가 시작 → 2022 중기부 현장방문·협업과제 선정 → 이후 민간주도 로컬브랜드 대표사례.",
  m:"<b>민간이 먼저 증명, 공공은 나중에 확장</b>" },
{ s:2,t:"s",q:"공주 제민천 '마을호텔'의 체류 흐름 5단계를 영어로 쓰시오.",
  g:[["sleep","숙박"],["eat","식사","먹"],["work","일","코워킹"],["meet","만남","만나"],["stay","머묾","체류","정착"]],
  a:"SLEEP → EAT → WORK → MEET → STAY",
  e:"게스트하우스 → 동네 식당·카페 → 코워킹 → 주민·청년 운영자 → 재방문·정착 가능성. 방문객 소비를 한 가게에 가두지 않고 마을 전체로 분산시킨다.",
  m:"<b>자고 · 먹고 · 일하고 · 만나고 · 머문다</b> = 하루 일과" },
{ s:2,t:"s",q:"제민천에서 '머무름의 이유'를 만든 첫 장치인 한옥 게스트하우스의 이름은?",
  g:[["봉황재"]], a:"봉황재",
  e:"2018년 권오상 대표(퍼즐랩)가 시작. 1960년대 도시형 한옥을 보존하고 불편(화장실·냉난방)만 제거. 밖으로 나가 골목을 걷게 만들어 당일 방문을 체류로 바꿨다.",
  m:"봉황재 = 객실, CREAM = 로비, 업스테어스 = 라운지" },
{ s:2,t:"s",q:"로컬 크리에이터의 능력 6단계를 순서대로 쓰시오.",
  g:[["발견"],["재해석"],["가치"],["콘텐츠"],["상업"],["확산"]],
  a:"발견 → 재해석 → 가치 부여 → 콘텐츠화 → 상업화 → 확산",
  e:"자원은 원래부터 있었다. 차이는 누가 어떻게 읽고 해석해서 어떤 경험으로 바꾸었는가에서 생긴다.",
  m:"<b>보고 → 다시 보고 → 의미 주고 → 만들고 → 팔고 → 퍼뜨린다</b>" },
{ s:2,t:"s",q:"커뮤니티 유형 매트릭스의 두 축은?",
  g:[["커뮤니티성"],["비즈니스성"]], a:"커뮤니티성 (세로) × 비즈니스성 (가로)",
  e:"BEST PRACTICE(커뮤니티 → 비즈니스: 개항로·문래), BOUNDARY(비즈니스 → 커뮤니티: 양양 서피비치), GROWING(커뮤니티 성장 중), LOCAL SHOP(아직 커뮤니티 약함). 커뮤니티와 비즈니스는 흑백이 아니다.",
  m:"<b>커·비</b> 두 축, 4칸" },
{ s:2,t:"s",q:"커뮤니티 유형 매트릭스에서 양양 서피비치가 속한, '비즈니스 → 커뮤니티' 유형은?",
  g:[["boundary","바운더리","경계"]], a:"BOUNDARY",

  m:"<b>개참 · 제체</b>" },
{ s:2,t:"w",q:"문래 창작촌에서 커뮤니티와 비즈니스는 어떤 순서로 생겼는지 설명하시오.",
  k:[["예술가 생활권이 먼저",["예술가","생활권","먼저"]],["낮은 임대료·빈 철공소",["임대료","철공소"]],["해석이 바뀐 뒤 비즈니스",["해석","나중","올라타"]]],
  model:"처음부터 핫플을 만든 것이 아니라, 낮은 임대료와 빈 철공소를 찾아 들어온 예술가들의 생활권이 먼저 생겼다. 작업실·전시·워크숍으로 철공소와 예술이 공존하는 분위기가 생기자 카페·갤러리 같은 비즈니스가 따라왔다. 사람이 먼저 해석을 바꾸고, 비즈니스는 나중에 그 해석 위에 올라탄다.",
  e:"순서: 개인 작업실 → 느슨한 네트워크 → 발표 활동 → 방문 경험 → 상업 확장.",

{ s:2,t:"w",q:"로컬 크리에이터의 정의를 쓰고, 핵심 역할을 한 문장으로 덧붙이시오.",
  k:[["지역의 자연·문화 특성",["자연","문화","특성"]],["아이디어 결합",["아이디어"]],["사업적 가치 창출하는 창업가",["사업","창업"]],["이미 있던 자원을 새로 읽고 번역",["이미","번역","재해석","새롭게"]]],

  e:"정의(중기부) + 3차시 마지막 문장을 같이 쓰면 만점.",

{ s:2,t:"w",q:"이야기가게 사례에서 '커뮤니티 규칙은 선언문보다 반복되는 대우에 새겨진다'는 말을 사례로 설명하시오.",
  k:[["자율 가격",["자율","저금통","가격"]],["알바생도 주인",["알바","주인"]],["오래 머물 권리·낮은 문턱",["머물","문턱"]]],
  model:"이야기가게는 회칙을 내세우기보다 돼지저금통 자율 가격, 알바생도 주인으로 대하기, 커피 한 잔으로도 오래 머물 권리처럼 공간 안에서 반복되는 대우로 문화를 만들었다. 이렇게 대우받은 손님과 알바생이 구성원이 되어 구술·기록·운영에 참여했다.",
  e:"규칙 = 말이 아니라 행동. 5차시 '약속의 진심은 행동에서 드러난다'와 같은 논리.",
  m:"<b>어떻게 대우받는가 = 그 커뮤니티의 규칙</b>" },
{ s:2,t:"x",q:"굿러너 사례를 '케이스를 읽는 프레임'으로 분석하시오. (출발점·핵심 거점·주요 플레이어·반복 활동·인지 확산·수익 구조·지역 효과 중 4개 이상)",
  k:[["출발점: 러너의 불편",["불편","출발"]],["핵심 거점: 서울숲 스토어",["서울숲","스토어","거점"]],["플레이어: 이윤주·크루·브랜드·지역",["이윤주","크루","브랜드"]],["반복 활동: 그룹런·훈련·대회",["그룹런","훈련","대회"]],["수익: 대회·아카데미·리테일",["수익","리테일","판매"]],["지역 효과",["지역","코스"]]],
  model:"출발점은 대회가 주최자 중심이라 러너의 감정이 뒷순위였던 불편이다. 주요 플레이어는 러너 출신 이윤주 대표와 현장 피드백을 준 러닝 크루, 프로그램을 후원한 스포츠 브랜드, 대회 장소를 제공한 지역 파트너다. 반복 활동은 그룹런·훈련·레이스로, 소속감과 성취를 반복해서 만든다. 핵심 거점은 서울숲 스토어로, 제품 체험과 만남의 장소가 된다. 수익은 아카데미·대회·리테일에서 나오고, 현장 인사이트가 상품 큐레이션을 정교하게 한다. 지역 효과로 서울숲을 러닝 리테일 거점으로 만들고 산과 도시의 코스를 대회·콘텐츠로 연결했다. 결국 관계가 인사이트가 되고, 인사이트가 상품이 되며, 상품이 다시 참여자를 늘리는 선순환이다.",
  e:"7단계를 다 못 써도 4개 이상 + 결론(선순환)이면 충분하다.",
  m:"굿러너 = <b>러너의 경험을 훈련→대회→콘텐츠→리테일로 확장한 모델</b>" },

{ s:3,t:"w",q:"마케팅과 브랜딩의 관계를 설명하시오.",
  k:[["마케팅 = 교환가치 활동",["교환"]],["브랜딩 = 의미와 선호",["의미","선호"]],["4P 등 구체 활동",["가격","유통","프로모션","4p"]],["단기/장기로만 나누면 안 됨",["단기","장기"]],["브랜딩은 마케팅·조직 행동 안에서 구현",["구현","안에서","연결"]]],
  model:"마케팅은 고객을 이해하고 교환가치를 만드는 활동 전체로 제품·가격·유통·프로모션을 다룬다. 브랜딩은 어떤 브랜드로 기억될지 정하고 약속과 경험의 일관성을 만드는, 의미와 선호를 쌓는 관점이다. 둘은 단기·장기로만 나뉘는 별개의 일이 아니라 연결된 활동이며, 브랜딩은 마케팅과 조직의 행동 안에서 구현된다.",
  e:"흔한 오답: '마케팅은 단기, 브랜딩은 장기'로만 쓰기. 교수님은 이 단순 구분을 경계했다.",
  m:"마케팅 = <b>팔기 위한 모든 활동</b>, 브랜딩 = <b>그 안에 깔린 의미</b>" },
{ s:3,t:"w",q:"브랜드 아이덴티티와 브랜드 이미지의 차이를 Patagonia 사례로 설명하시오.",
  k:[["아이덴티티 = 운영자가 정한 방향",["정한","의도","운영자","기업"]],["이미지 = 고객에게 생긴 인식",["고객","인식"]],["Worn Wear·행동으로 간극을 좁힘",["worn","수선","행동"]]],
  model:"아이덴티티는 운영자가 정하는 의도된 방향이고, 이미지는 방문·사용·리뷰로 고객에게 실제로 생긴 인식이다. Patagonia는 '환경'이라는 아이덴티티를 'Don't Buy This Jacket' 광고로 말하는 데 그치지 않고, Worn Wear 수선 서비스라는 행동으로 증명해 고객의 이미지를 아이덴티티에 가깝게 만들었다.",
  e:"'친근하다는 말보다 친근하게 대하는 경험이 이미지를 만든다.' 8차시에는 Brand Reality(실체)가 추가된다.",
  m:"<b>아이덴티티 = 되고 싶은 나, 이미지 = 남이 보는 나</b>" },
{ s:3,t:"w",q:"Plassmann의 와인 실험(2008)이 브랜딩에 주는 시사점을 쓰시오.",
  k:[["같은 와인, 비싼 가격표가 더 맛있게",["가격","비싼"]],["실제 쾌감 영역(mOFC) 활성",["뇌","쾌감","mofc"]],["기대가 경험을 바꾼다",["기대"]]],
  model:"같은 와인도 비싼 가격표가 붙었을 때 더 맛있다고 평가했고, 실제 쾌감을 느끼는 뇌 영역이 더 활성화됐다. 즉 내용물에 대한 기대가 실제로 느끼는 경험에도 영향을 준다. 브랜드가 만드는 기대가 제품 경험의 질 자체를 바꿀 수 있다는 뜻이다.",

  m:"<b>이름이 맛을 바꾸고, 가격이 맛을 바꾼다</b>" },
{ s:3,t:"x",q:"Volvo 사례에 '의미 있는 차별화의 3기준'을 적용해, 왜 '볼보 = 안전'이 강한 핵심연상이 되었는지 서술하시오.",
  k:[["관련성: 생명·가족과 직결",["관련","생명","가족"]],["구별성: 안전을 1순위로 고정",["구별","우선","1순위"]],["증명: 3점식 안전벨트·특허 공개",["증명","안전벨트","특허"]],["핵심연상 = 기억의 우선순위",["핵심연상","우선순위"]],["일관된 반복",["일관","반복"]]],
  model:"의미 있는 차별화는 관련성·구별성·증명을 갖춰야 한다. 관련성 면에서, 차를 사는 사람에게 안전은 가족과 생명에 직결되므로 고객이 좋아할 이유가 분명하다. 구별성 면에서, 모든 자동차가 안전하다고 말할 수 있지만 볼보는 여러 장점 중 안전을 기억의 1순위로 고정해 다른 브랜드가 똑같이 말하기 어렵다. 증명 면에서, 1959년 3점식 안전벨트를 개발하고 '생명을 구하는 기술은 독점할 수 없다'며 특허를 공개한 행동이 말을 사실로 만들었다. 이 이야기를 일관되게 반복했기 때문에 '볼보 = 안전'이 강한 핵심연상이 되었다. 핵심연상은 기억의 우선순위다.",
  e:"정·기·사·선 구조로: 정의(의미 있는 차별화) → 기준(관·구·증) → 사례(볼보 대입) → 결론(핵심연상).",
  m:"Volvo = <b>관(생명)·구(1순위)·증(1959 안전벨트)</b>" },
{ s:3,t:"x",q:"춘천의 작은 동네 카페의 브랜드 아이덴티티를 Aaker 구조(에센스·코어·확장)로 설계하고, 각 층위의 역할을 설명하시오.",
  k:[["에센스: 하나의 중심 의미 + 내부 판단 기준",["에센스","소울","중심"]],["코어: 지킬 핵심 약속(소수)",["코어","핵심","약속"]],["확장: 성격·상징·실행 예",["확장","성격","말투"]],["구체적 실행 예시",["예","메뉴","카드","모임"]]],
  model:"에센스는 모든 선택이 향하는 중심 의미로 '산책길에 쉬어 가는 이웃집'으로 정한다. 메뉴와 응대를 정할 때 '이웃집처럼 편한가?'를 묻는 내부 기준이 된다. 코어는 환경이 바뀌어도 지킬 약속으로 ① 편히 머무는 환대 ② 춘천 제철 재료 ③ 동네 사람 잇기의 세 가지다. 확장은 핵심에 구체적인 표정을 더하는 것으로, 손글씨 메뉴판(친근한 성격), 소양강 사진 엽서(지역 상징), 주말 산책 모임(관계)으로 드러낸다. 이렇게 하면 많은 이야기를 해도 중심이 분명해진다.",
  e:"각 층위의 '질문'을 함께 쓰면 좋다: 에센스(결국 무엇을 의미하나) / 코어(무엇을 잃으면 우리답지 않나) / 확장(구체적으로 어떤 모습인가).",
  m:"<b>영혼 → 가치관 → 옷차림</b>" },

{ s:4,t:"s",q:"마스코트 로고의 장점과 과제를 한 가지씩 쓰시오.",
  g:[["친밀"],["운영","규칙","지속"]], a:"장점: 친밀도가 매우 높아짐 / 과제: 지속적인 운영(성격·말투 규칙)",

{ s:4,t:"s",q:"BLUE가 주는 감정 연상을 쓰시오. (부정적 연상 포함)",

  e:"금융·기술에서 유능함을 전할 때 검토하는 색. 밝은 블루와 네이비는 인상이 다르다. 색으로 신뢰를 제안하고, 경험으로 증명한다.",

{ s:4,t:"s",q:"ORANGE가 주는 감정 연상을 쓰시오.",

  e:"식감이 느껴지는 색. 따뜻함에도 서로 다른 온도와 강도가 있다(살구·주황·테라코타). 예: Dunkin'.",
  m:"<b>귤과 치킨</b>" },
{ s:4,t:"s",q:"감정 연상이 긍정과 부정 양면으로 나타나는 대표 색 3가지는?",
  g:[["레드","red","빨강"],["블루","blue","파랑"],["블랙","black","검정"]], a:"레드(열정↔위험) · 블루(신뢰↔슬픔) · 블랙(고급↔두려움)",
  e:"RED: 열정·생명·흥분 / 분노·위험. BLUE: 유능·신뢰 / 슬픔. BLACK: 힘·고급 / 두려움. 같은 색도 맥락과 조합에 따라 다르게 읽힌다.",
  m:"<b>불은 따뜻하지만 데이고, 바다는 차분하지만 슬프고, 턱시도는 고급이지만 어둠은 무섭다</b>" },
{ s:4,t:"s",q:"금융 업종의 색 관습(블루)을 벗어나 옐로우를 쓴 국내 사례는?",

  e:"다른 관습 탈피 사례: 식품인데 블루(포카리스웨트), 자동차인데 옐로우 배지(Ferrari), 명품인데 오렌지(Hermès). 관습을 따르면 이해가 빠르고, 벗어나면 설명이 필요하다.",

  g:[["바람"]], a:"바람",
  e:"뜻의 계열을 공유하면 이름 사이에 가족성이 생긴다. 5차시 브랜드 아키텍처의 '명명 체계(Nomenclature)'와 연결.",

  g:[["jet","젯"]], a:"Jet",
  e:"모브랜드 이름이 없어도 돌림자로 누구의 자식인지 알 수 있다. BMW 3·5·7 시리즈, 벤츠 C·E·S 클래스도 마찬가지.",
  m:"<b>돌림자 = 가족 이름</b>" },
{ s:4,t:"w",q:"설명형 이름과 연상형 이름의 장단점을 예를 들어 비교하시오.",
  k:[["설명형 = 무슨 일을 하는지",["무슨일","업종","설명"]],["설명형 장점: 초기 설명 비용 적음",["초기","비용"]],["설명형 단점: 확장 어려움",["확장"]],["연상형 = 의미·감정",["의미","감정"]],["예시",["직방","오늘의집","apple","nike","애플","나이키"]]],
  model:"설명형 이름(직방·오늘의집)은 이름만으로 무슨 일을 하는지 전해 초기 설명 비용이 적지만, 다른 업종으로 확장할 때 이름이 걸림돌이 된다. 연상형 이름(Apple·Nike)은 의미와 감정을 먼저 전해 초기에 업종을 알려야 하는 부담이 있지만, 확장이 자유롭다. 따라서 처음의 설명 비용과 이후의 확장 비용을 함께 보고 선택해야 한다.",
  e:"마지막 결론 문장(설명 비용 vs 확장 비용)이 교수님 표현 그대로다.",
  m:"<b>처음 설명 비용 vs 나중 확장 비용</b>" },
{ s:4,t:"w",q:"Liquid Death가 '이름이 세계관으로 번진' 사례인 이유를 설명하시오.",
  k:[["물 + 죽음 = 통념 뒤집기",["죽음","통념","뒤집"]],["말투(Murder your thirst 등)",["말투","murder","thirst"]],["시각(해골·블랙레터·캔)",["해골","캔","시각","디자인"]],["경험(메탈·공연)",["메탈","공연","경험"]],["같은 성격 반복",["같은","일관"]]],
  model:"생명을 상징하는 물에 '죽음'을 붙여 순수·건강의 언어 대신 메탈·반항·블랙 유머의 언어로 통념을 뒤집었다. 이 성격이 이름에서 끝나지 않고 'Murder your thirst' 같은 말투, 해골·블랙레터 서체의 캔 디자인, 메탈·펑크 공연 경험까지 같은 방향으로 이어졌다. 이름·말투·디자인·경험이 같은 성격을 전했기 때문에 세계관이 되었다.",
  e:"핵심 문장: '이름만으로, 물을 마시는 일의 의미를 바꾼다.'",
  m:"<b>건강한 제품의 불량한 마케팅</b>" },
{ s:4,t:"w",q:"'관습을 따르면 이해가 빠르고, 벗어나면 설명이 필요하다'를 브랜드 색 사례로 설명하시오.",
  k:[["업종별 관습 색",["관습","업종","카테고리"]],["관습 탈피 사례",["카카오뱅크","포카리","ferrari","페라리","hermes","에르메스"]],["벗어나면 설명·증명 필요",["설명","증명"]]],
  model:"업종마다 자주 쓰는 색이 있어 관습을 따르면 고객이 빨리 이해한다. 예를 들어 금융은 신뢰를 주는 블루가 관습인데, 카카오뱅크는 옐로우를 써서 친근하고 쉬운 은행이라는 차이를 보여줬다. 대신 '믿을 수 있는 은행'이라는 점은 경험으로 따로 증명해야 한다. 포카리스웨트도 식품인데 블루를 써서 청량함을 전했다.",
  e:"관습 탈피 = 차별화의 기회지만 설명 비용이 든다. 덜 쓰인 색을 고르는 것만으로 차별화가 완성되지는 않는다.",
  m:"<b>카뱅 노랑, 포카리 파랑</b>" },
{ s:4,t:"w",q:"명조 계열과 고딕 계열 서체가 주는 인상과 쓰임을 비교하시오.",
  k:[["명조: 정교함·문학성·전통",["정교","문학","전통"]],["고딕: 현대성·명료함",["현대","명료"]],["명조는 편집·서사, 고딕은 디지털",["편집","서사","디지털","화면"]]],
  model:"명조 계열은 획의 대비와 끝부분 표현으로 정교함·문학성·전통을 전해 편집·서사 중심 브랜드에서 검토하고, 작은 화면에서는 가는 획을 점검해야 한다. 고딕 계열은 단순하고 명료한 획으로 현대성·명료함을 전해 다양한 디지털 접점에 맞지만, 흔한 형태만 쓰면 개성이 약해질 수 있다.",
  e:"명품 브랜드들이 줄줄이 산세리프(고딕 계열)로 바꾼 이유도 '작은 화면·디지털 환경' 때문.",
  m:"<b>명조는 책, 고딕은 스마트폰</b>" },
{ s:4,t:"x",q:"'라누가'와 '카루파' 중 하나는 수면 제품, 하나는 스포츠 음료 이름으로 쓰려 한다. 6차시의 소리 이론을 근거로 각각 어울리는 제품을 정하고 이유를 서술하시오.",
  k:[["라누가 → 수면 제품",["라누가"]],["ㄹ(유음)·ㄴ(비음) → 부드러움",["유음","비음","부드"]],["카루파 → 스포츠 음료",["카루파"]],["ㅋ·ㅍ(격음) → 긴장·활력",["격음","긴장","강"]],["소리가 제품과 맞는가",["맞","어울"]]],
  model:"6차시에 따르면 소리의 스타일이 이름의 인상에 영향을 준다. '라누가'는 유음 ㄹ과 비음 ㄴ, 평음 ㄱ으로 이루어져 부드럽고 안정적인 인상을 주므로, 편안한 잠을 약속하는 수면 제품에 어울린다. '카루파'는 격음 ㅋ과 ㅍ이 들어가 거칠고 긴장감 있는, 터지는 듯한 인상을 주므로 활력과 에너지를 약속하는 스포츠 음료에 어울린다. 어떤 소리가 더 좋은가보다 어떤 소리가 제품과 더 잘 맞는가가 기준이며, 최종 판단은 실제 고객 반응으로 확인한다.",
  e:"강의 슬라이드는 질문으로만 제시했으므로, 근거(자음 분류)를 정확히 쓰는 것이 채점 포인트.",
  m:"<b>ㄹㄴ = 이불, ㅋㅍ = 탄산</b>" },
{ s:4,t:"w",q:"심벌 중심 로고와 워드마크 중심 로고 중 무엇을 고를지 판단하는 기준을 쓰시오.",
  k:[["접점",["접점"]],["인지도",["인지도"]],["심벌: 작은 공간·언어 장벽에 유연",["작은","언어","아이콘"]],["워드마크: 이름을 읽히는 데 집중",["이름","읽"]]],
  model:"심벌의 유무보다 어느 접점에서 가장 많이 보여줄지와 현재 인지도에 맞는지가 기준이다. 심벌은 아이콘·제품·공간처럼 작은 곳과 언어 장벽에 유연하지만 초기엔 이름과 연결하는 학습이 필요하다. 워드마크는 이름을 읽히는 데 집중해 이름과 시각 인식을 함께 학습시키지만, 긴 이름은 작은 화면 대응이 필요하다.",
  e:"핵심 문장: '심벌의 유무보다, 접점과 인지도에 맞는가.'",
  m:"<b>어디서 보여줄까 + 얼마나 알려졌나</b>" },

{ s:5,t:"s",q:"7차시에서 아이덴티티 구조의 중심을 부른 이름은? (브랜드를 관통하는 하나의 중심 의미)",

  g:[["내부"],["고객"]], a:"브랜드소울은 내부 기준, 슬로건은 고객에게 하는 말",
  e:"소울은 구성원이 같은 방향으로 판단하기 위한 내부 지침이고, 슬로건은 고객에게 건네는 한 문장(확장 영역)이다.",

{ s:5,t:"s",q:"차별점은 고객이 얻는 세 가지 가치(베네핏)가 되어야 한다. 세 가지는?",

  e:"기능적: 사용하며 실제로 얻는 편익 / 감성적: 사용자가 느끼는 기분 / 사회적: 관계·소속·자기표현에서 얻는 가치.",

  g:[["세계관","헤리티지"],["성격","심상"],["열망","라이프스타일"],["사용상황","관계"],["아이덴티티전달","아이덴티티"]],
  a:"세계관·헤리티지형 · 성격·심상형 · 열망·라이프스타일형 · 사용상황·관계형 · 아이덴티티 전달형",
  e:"뿌리와 삶의 방식(Patagonia·Burberry) / 색·빛·상징물의 느낌(포카리·Tiffany) / 동경하는 삶(LV·Ralph Lauren) / 언제 누구와(Coca-Cola) / 약속하는 기능을 대표 장면으로(Volvo).",
  m:"<b>뿌리 · 느낌 · 꿈 · 장면 · 약속</b> → \"뿌리 깊은 느낌의 꿈 같은 장면을 약속한다\"" },
{ s:5,t:"s",q:"Patagonia(거대 자연 속 작은 사람)와 Burberry(영국 날씨와 코트)의 키비주얼 유형은?",
  g:[["세계관","헤리티지"]], a:"세계관·헤리티지형",
  e:"브랜드의 뿌리와 중요하게 여기는 삶의 방식을 보여준다. Patagonia는 자연과 모험, Burberry는 태생과 전통.",
  m:"<b>뿌리</b>를 보여준다" },
{ s:5,t:"s",q:"포카리스웨트(청백색·청춘)와 Tiffany & Co.(블루 박스)의 키비주얼 유형은?",
  g:[["성격","심상"]], a:"성격·심상형",
  e:"색·빛·인물·상징물로 브랜드 특유의 느낌을 쌓는다. 사진이 바뀌어도 같은 감정과 연상이 남도록 시각적 단서를 유지한다.",
  m:"<b>느낌</b>을 쌓는다" },
{ s:5,t:"s",q:"Louis Vuitton(여행과 가방)과 Ralph Lauren(승마와 여가)의 키비주얼 유형은?",
  g:[["열망","라이프스타일"]], a:"열망·라이프스타일형",
  e:"고객이 동경하거나 자신과 연결하고 싶은 삶을 보여준다. 제품의 소유를 넘어 '이 브랜드와 함께하는 나의 모습'을 제안한다.",
  m:"<b>꿈</b>을 보여준다" },
{ s:5,t:"s",q:"Coca-Cola(사람·음식·콜라가 한 식탁에)의 키비주얼 유형은?",
  g:[["사용상황","관계"]], a:"사용상황·관계형",
  e:"언제, 누구와 함께할 브랜드인지 장면으로 연결한다. 연결되는 의미: 함께 먹는 시간의 즐거움.",
  m:"<b>장면</b>을 보여준다 (언제·누구와)" },
{ s:5,t:"s",q:"Volvo(여러 대의 차를 쌓아 견고함을 시각화)의 키비주얼 유형은?",
  g:[["아이덴티티"]], a:"아이덴티티 전달형",
  e:"브랜드가 약속하는 기능과 가치를 대표 장면으로 압축한다. 안전에 대한 신뢰. Volvo는 5(차별화)·6(네이비)·7(키비주얼)차시에 모두 '안전'으로 등장.",
  m:"<b>약속</b>을 보여준다" },
{ s:5,t:"s",q:"7차시 좋은 이름의 판단 기준에서, 6차시 4기준(의미연상성·차별적 개성·발음용이성·기억용이성)에 추가된 2가지는?",
  g:[["표기","사용"],["소리"]], a:"표기·사용 · 소리의 인상",
  e:"표기·사용: 한글·영문·검색·확장에 무리가 없는가 / 소리의 인상: 자음·모음 조합이 의도한 인상을 주는가. 반드시 다 충족할 필요는 없다.",
  m:"4기준 + <b>쓰기 + 소리</b> = 6기준" },
{ s:5,t:"s",q:"실습에서 '첫인상 확인'은 이름과 BI(또는 키비주얼)만 몇 초 보여주고 확인했나?",
  g:[["5"]], a:"5초",
  e:"설명 전에 보여주고 \"무슨 상품? 어떤 성격? 누구를 위한 것?\"을 묻는다. 의도와 다르게 읽힌 점 1개를 수정 → 아이덴티티(의도)와 이미지(실제 인식)의 간극을 확인하는 과정.",
  m:"<b>5초 안에 안 읽히면 다시</b>" },
{ s:5,t:"s",q:"7차시 실습 평가 기준에서 가장 배점이 큰 두 항목(각 25점)은?",
  g:[["고객"],["아이덴티티"]], a:"고객 적합성(25) · 아이덴티티(25)",
  e:"고객 적합성 25 · 아이덴티티 25 · 네이밍 근거 20 · 시각 표현 20 · 과정·발표 10. 고객과 의미가 가장 중요하다.",
  m:"<b>25·25·20·20·10</b>, 고객과 영혼이 절반" },
{ s:5,t:"w",q:"7차시 실습에서 AI 사용 범위의 원칙을 쓰시오.",
  k:[["사람이 판단",["사람","판단"]],["AI는 비주얼(이미지)만",["이미지","비주얼","시각"]],["고객·아이덴티티·네임은 직접 작성",["직접"]],["사용 기록(도구·프롬프트·수정)",["기록","프롬프트"]]],
  model:"사람이 판단하고, AI는 팀이 정한 방향을 이미지로 구현한다. 고객·아이덴티티·네임·이유·소감은 직접 작성하고, AI는 팀이 결정한 BI와 키비주얼 이미지 생성·수정에만 쓴다. 도구명·실제 프롬프트·채택·수정 이유를 기록한다.",
  e:"'AI에게는 비주얼만 부탁합니다.'",
  m:"<b>생각은 사람, 그림은 AI</b>" },
{ s:5,t:"w",q:"'네이밍과 디자인을 위한 모든 선택에 이유를 붙인다'는 7차시 원칙의 의미를 쓰시오.",
  k:[["예뻐서·좋아서 이상의 근거",["예뻐","좋아서"]],["고객·브랜드소울과 연결",["고객","소울"]],["후보 비교 후 선택",["후보","비교"]],["앞뒤가 같은 방향",["방향","일관","연결"]]],
  model:"이름과 디자인을 '예뻐서, 좋아서' 고르지 않고, 후보를 같은 기준으로 비교한 뒤 왜 그것이 고객과 브랜드소울(약속)에 맞는지 문장으로 설명해야 한다는 뜻이다. 고객 → 약속 → 이름 → BI → 키비주얼이 같은 방향을 가리켜야 설득력 있는 브랜드 제안이 된다.",
  e:"이 원칙이 곧 시험 안내문의 '선택의 근거를 연결한다'와 같다. 서술형 채점 기준으로 생각하자.",
  m:"<b>예뻐서 → 왜냐하면 고객이 ~이고, 우리의 약속이 ~이기 때문에</b>" },
{ s:5,t:"x",q:"새로운 무알코올 탄산음료 브랜드를 만든다. 주고객·사용상황을 정하고, 키비주얼 5유형 중 하나를 골라 선택 근거를 서술하시오.",
  k:[["주고객·사용상황 구체화",["고객","상황","장면"]],["브랜드소울",["소울","중심","약속"]],["키비주얼 유형 선택",["형"]],["유형 선택의 근거(고객과 연결)",["때문","이유","근거"]],["색·표현 등 구체 요소",["색","컬러","장면","오렌지","옐로우","블루","그린"]]],
  model:"키비주얼은 브랜드의 약속을 대표 장면으로 보여주는 이미지다. 주고객은 술 대신 친구들과 어울리고 싶은 20대, 사용상황은 금요일 저녁 친구들과의 모임으로 정한다. 브랜드소울은 '취하지 않아도 충분히 즐거운 시간'이다. 이 고객에게는 무엇을 마시는지보다 언제, 누구와 마시는지가 중요하므로, Coca-Cola의 함께 먹는 식탁처럼 친구들이 잔을 부딪치는 장면을 보여주는 사용상황·관계형을 선택한다. 색은 기쁨·활기를 주는 오렌지와 옐로우로 하고, 로고는 잔이 부딪치는 순간 테이블 중앙에 둔다. 고객이 '이럴 땐 이거'라고 떠올려야 구매고려군에 들어갈 수 있기 때문이다.",
  e:"정·기·사·선: 키비주얼 정의 → 5유형 중 선택 → 고객·소울과 연결 → 결론(구매고려군).",
  m:"<b>고객 → 소울 → 유형 → 이유</b> 한 줄로 이어지게" },

  g:[["reality","실체"],["identity","의도"],["image","이미지","연상"]], a:"Brand Reality(실체) · Brand Identity(의도된 연상) · Brand Image(연상이미지)",
  e:"Reality: 장단점을 모두 가진 사실 그대로의 브랜드 / Identity: 기업이 목표로 하는 모습 / Image: 소비자가 가진 연상의 집합. 커뮤니케이션은 세 모습의 교집합(공감의 영역)을 넓히는 활동.",

  g:[["planning","계획","플래닝"],["result","결과"]], a:"Identity = Planning(계획) / Image = Result(결과)",
  e:"아이덴티티는 기업이 계획한 것, 이미지는 고객에게 결과로 생긴 것.",
  m:"<b>계획은 기업이, 결과는 고객이</b>" },
{ s:6,t:"s",q:"브랜딩 커뮤니케이션의 범위 3가지는? ('~하는 것' 형태)",
  g:[["말하"],["하게"],["느끼"]], a:"말하는 것 · 하게 하는 것 · 느끼게 하는 것",
  e:"말하는 것(광고·콘텐츠·직원 설명) / 하게 하는 것(체험·행사·팝업·가입·구매) / 느끼게 하는 것(공간·사용 과정·응대·구매 후 관리). 고객은 말과 경험을 함께 기억한다.",
  m:"<b>말 · 행 · 느</b>" },
{ s:6,t:"s",q:"브랜드가 고객과 관계를 맺는 4단계를 순서대로 쓰시오.",
  g:[["인지"],["선호"],["구매"],["충성"]], a:"인지 → 선호 → 구매 → 충성 (→ 팬덤)",
  e:"알게 한다(도달·기억·검색) → 좋아하게 한다(공감·신뢰·고려) → 사용하게 한다(체험·선택·결제) → 다시 찾게 한다(재구매·추천). 충성 고객의 추천이 새 고객의 인지를 만든다.",
  m:"<b>알 · 좋 · 사 · 또</b>" },
{ s:6,t:"s",q:"인지 단계에서 '소재'의 4가지 종류는?",
  g:[["영상"],["이미지"],["텍스트"],["소리"]], a:"영상 · 이미지 · 텍스트 · 소리",
  e:"소재는 전달할 표현, 매체는 고객과 만나는 자리(전통매체·인터넷·옥외·PR). 기억시킬 브랜드와 한 가지 메시지를 정한다.",
  m:"<b>소재는 요리, 매체는 그릇</b>" },
{ s:6,t:"s",q:"인지 광고에서 기억시킬 '한 가지 메시지'는 무엇 중에서 고르는 것이 좋은가?",
  g:[["약속","베네핏","benefit"]], a:"약속 / 베네핏 중에서",
  e:"기능에 자신 있다면 기능을 가감 없이 보여주는 것만으로도 훌륭하다(Apple 손떨림 방지, Samsung 수평 유지). 스펙을 눈으로 증명해서 각인시킨다.",
  m:"<b>한 브랜드, 한 메시지</b>" },
{ s:6,t:"s",q:"듀오링고가 2025년 진행한 PR 캠페인의 핵심 사건은?",
  g:[["사망","죽음","죽"]], a:"마스코트 '듀오(초록 부엉이)' 사망 발표",
  e:"2주간 소셜 노출 17억 회. XP 500억 점을 쌓으면 부활시킨다는 공동 미션 → 10일 만에 부활. 캐릭터 스토리가 대중의 놀이가 되자 언론이 반응했다.",
  m:"<b>17억 · 500억 · 10일</b>" },
{ s:6,t:"s",q:"배달의민족이 2015년부터 음식을 소재로 짧은 시를 공모한 PR 캠페인은?",

  e:"2022년 응모작 53만 편. 소비자를 광고의 수신자가 아니라 콘텐츠 생산자로 만들었다. PR은 알리고 싶은 사실을 이야기할 만한 사건으로 만든다.",
  m:"<b>53만 편</b>, 손님이 작가" },
{ s:6,t:"s",q:"LUSH가 빈 용기를 매장에 반환하게 해 환경 철학에 고객이 참여하게 한 캠페인은?",
  g:[["bringitback","브링잇백"]], a:"Bring It Back",
  e:"작은 실천 + 보상 → 가치에 동참한 기억. 철학은 선언보다 '고객이 함께할 수 있는 행동'에서 강해진다.",
  m:"<b>가져오세요</b> = 같이 지키는 철학" },
{ s:6,t:"s",q:"고객여정맵(Customer Journey Map)에서 고객의 시간 순서에 겹쳐 보는 4가지는?",
  g:[["상황"],["행동","접점"],["생각","감정"],["개선"]], a:"고객·상황 · 행동·접점 · 생각·감정 · 개선 기회",
  e:"누가 어떤 목적으로 / 무엇을 하며 어떤 사람·매체·공간을 만나나 / 어디서 기대·불안·불편한가 / 불편을 줄이고 약속을 증명할 방법.",
  m:"<b>누가 · 뭘 하며 · 어떤 기분 · 어떻게 고칠까</b>" },
{ s:6,t:"s",q:"고객여정맵을 그리기 위해 설정하는, 구체적인 가상의 대표 고객 인물을 뭐라 하나?",
  g:[["페르소나","persona"]], a:"페르소나 (Persona)",
  e:"예: 36세 전업주부 이혜연, 한강신도시 거주, 아이들과 넓은 카페를 찾음. 공간의 크기와 건강한 메뉴를 중요하게 여김.",
  m:"<b>가면(persona)을 쓴 대표 고객</b>" },
{ s:6,t:"s",q:"Red Bull이 성층권 자유낙하를 생중계해 '한계를 넘는 도전' 자체를 사건으로 만든 스폰서십은?",
  g:[["stratos","스트라토스"]], a:"Red Bull Stratos",
  e:"약속(날개를 펼치는 도전) → 사건(성층권 자유낙하) → 확산(생중계 → 뉴스 → 기록 영상). 후원 로고가 아니라 도전 자체를 세계적 사건으로.",
  m:"<b>로고를 붙이지 말고 사건을 만든다</b>" },
{ s:6,t:"s",q:"스폰서십이 '관계'가 되기 위해 필요한 3가지는?",
  g:[["팬문화","문화"],["현장","체험"],["반복","콘텐츠"]], a:"적합한 팬 문화 × 현장 체험 × 반복 콘텐츠",
  e:"최근 스폰서십은 '로고'보다 '팬의 경험'을 산다. 예: The North Face 100(트레일 문화), Spotify × FC Barcelona(음악과 축구 팬 연결), Samsung 올림픽 Victory Selfie.",
  m:"<b>팬 · 현장 · 반복</b>" },
{ s:6,t:"s",q:"좋은 팝업이 동시에 답해야 하는 두 가지 질문은?",
  g:[["왜와야","와야"],["무엇을","뭘"]], a:"\"왜 와야 하지?\" + \"와서 무엇을 하지?\"",
  e:"팝업은 제품 진열보다 방문할 장면을 만든다. 성수 탬버린즈(향 체험·오브제 → 사진·공유), 더현대 캐릭터 팝업(한정 굿즈 → 방문·구매·인증).",
  m:"<b>올 이유 + 할 거리</b>" },
{ s:6,t:"s",q:"판매촉진의 4가지 장치를 쓰시오.",
  g:[["할인"],["덤","1+1"],["쿠폰"],["적립"]], a:"할인 · 덤 · 쿠폰 · 추가 적립",
  e:"할인(무신사 기획전: 첫 선택을 앞당김) / 덤(CU 1+1: 체감 가치↑) / 쿠폰(스타벅스 쿠폰함: 조건·기한으로 방문 시점 제안) / 적립(만원별: 이번 주문을 다음 방문에 연결).",
  m:"<b>깎아주고 · 더 주고 · 기한 주고 · 다음을 준다</b>" },
{ s:6,t:"s",q:"AARRR의 다섯 단계를 영어로 쓰시오.",
  g:[["acquisition","유입"],["activation","활성"],["retention","유지"],["referral","추천"],["revenue","수익"]],
  a:"Acquisition(유입) · Activation(활성) · Retention(유지) · Referral(추천) · Revenue(수익)",
  e:"고객 행동을 아래로 좁혀 보는 깔때기. 구매 전후의 행동을 나눠 병목과 개선 방법을 찾는 프레임. 수치는 실제 데이터로 정의한다.",
  m:"<b>유·활·유·추·수</b> → \"유활유로 추수한다\" (해적 소리 '아르르!')" },
{ s:6,t:"s",q:"AARRR에서 Activation(활성)은 고객의 어떤 행동을 보는 단계인가?",
  g:[["쓸모","가치","첫"]], a:"어떤 쓸모(첫 가치)를 확인하는가 (활성·구매)",
  e:"무신사 예: 코디·후기를 보고 나에게 맞는 상품을 발견하는 순간. Acquisition(어디서 들어오나) 다음 단계.",
  m:"<b>들어왔다(유입) → 써보니 좋다(활성)</b>" },
{ s:6,t:"s",q:"AARRR에서 Retention은 무엇을 묻는 단계인가?",
  g:[["다시","재구매","재방문","유지"]], a:"왜 다시 사용하는가 (유지·재구매)",
  e:"무신사 예: 신상품·관심 브랜드 소식으로 재방문. 5차시 '재구매는 너무너무 중요'와 연결.",
  m:"Retain = <b>붙잡아 두다</b>" },
{ s:6,t:"s",q:"LTV의 뜻은? (한국어 또는 영어)",
  g:[["생애","lifetime"]], a:"고객 생애 가치 (Lifetime Value)",
  e:"반복 구매의 기여이익으로 본다. 고객 획득·혜택 비용도 함께 계산한다. 팬이 있으면 LTV가 올라간다.",
  m:"<b>L</b>ife<b>T</b>ime <b>V</b>alue = 한 고객이 평생 주는 가치" },
{ s:6,t:"s",q:"충성 고객이 느끼는 관계 혜택 3가지는? (Oliver, Gwinner 등)",
  g:[["확신"],["사회"],["특별"]], a:"확신의 혜택 · 사회적 혜택 · 특별 대우의 혜택",
  e:"확신: 믿고 맡길 수 있다(일관된 품질) / 사회적: 나를 알고 기억해 준다(이름으로 환영) / 특별 대우: 관계를 인정받는다(우선 초청).",
  m:"<b>믿어 · 알아 · 모셔</b>" },
{ s:6,t:"s",q:"CRM의 뜻(한국어)과, 실행할 때 정할 3가지 기준을 쓰시오.",
  g:[["고객관계관리","관계관리","customerrelationship"],["누구"],["언제"],["무엇"]], a:"고객 관계 관리 / 누구에게 · 언제 · 무엇을",
  e:"누구에게(첫 방문·재방문·오래 쉰 고객) / 언제(구매·사용·관심·이탈 신호) / 무엇을(정보·도움·참여 기회). 같은 메시지를 자주 보내는 것이 CRM의 전부가 아니다. 패턴과 타이밍이 중요.",
  m:"<b>누구에게 · 언제 · 무엇을</b>" },
{ s:6,t:"s",q:"멤버십·커뮤니티·서포터즈 중 관계의 중심이 '회원과 회원'인 것은?",
  g:[["커뮤니티"]], a:"커뮤니티",
  e:"멤버십: 브랜드 ↔ 회원(이용 기록과 혜택) / 커뮤니티: 회원 ↔ 회원(관심사·활동·관계) / 서포터즈: 브랜드 ↔ 참여자(체험·콘텐츠·피드백). 혜택을 받는 사람에서 함께하는 사람으로.",
  m:"<b>고객끼리 연결되면 커뮤니티</b>" },
{ s:6,t:"s",q:"Keller의 브랜드 공명 모델(CBBE)의 4단계를 아래부터 쓰시오.",
  g:[["인지","정체성"],["의미"],["반응"],["관계","공명"]], a:"정체성 인지 → 의미 → 반응 → 관계(브랜드 공명)",
  e:"이 브랜드를 알고 떠올린다 → 무엇을 주고 어떤 모습인가 → 믿고 좋아하는가 → 공명. 팬덤은 반복 구매를 넘어 애착·소속감·자발적 참여가 깊어진 관계.",
  m:"<b>알고 → 뜻 알고 → 좋아하고 → 하나 된다</b>" },
{ s:6,t:"s",q:"브랜드 공명(Resonance)의 4요소를 쓰시오.",
  g:[["행동"],["태도","애착"],["공동체"],["참여"]], a:"행동적 충성 · 태도적 애착 · 공동체 의식 · 적극적 참여",
  e:"반복해서 사용·구매 / 나에게 특별한 브랜드 / 같은 브랜드를 좋아하는 사람과 연결 / 시간·노력·창작을 자발적으로 보탠다.",
  m:"<b>행·태·공·적</b> → \"행태가 공적이다\"" },
{ s:6,t:"s",q:"고객이 팬이 되는 3가지 단서를 쓰시오.",
  g:[["반복구매","반복"],["애착"],["기여"]], a:"반복 구매 · 브랜드 애착 · 자발적 기여",
  e:"반복 구매는 대안으로 이동할 수 있다 / 애착은 가격만으로 비교하지 않는다 / 자발적 기여는 신규 고객을 데려온다. 팬 = 혜택이 없어도 다시 찾고 스스로 이야기를 보태는 사람.",
  m:"<b>사고 → 아끼고 → 보탠다</b>" },
{ s:6,t:"s",q:"LEGO Ideas에서 팬의 아이디어가 제품화 검토를 받으려면 몇 명의 지지가 필요한가?",
  g:[["1만","10000","만명"]], a:"1만 명",
  e:"팬의 제안 → 멤버 지지(1만 명) → 브랜드와 제품화 → 팬 디자이너 이름 소개. 고객은 소비자이면서 창작자·평가자·전파자가 될 수 있다.",
  m:"<b>만 명이 원하면 레고가 된다</b>" },
{ s:6,t:"s",q:"작은 팬 그룹에도 브랜드가 사람처럼 답하는 실행 모델 4단계는?",
  g:[["알아보"],["맞춰"],["함께"],["인정","감사"]], a:"알아보기 → 맞춰주기 → 함께하기 → 인정·감사",
  e:"이름·취향·경험을 기억 / 필요에 맞는 제안 / 구체적인 참여 역할 / 반영 결과를 직접 회신. 사람이 적어도 구체적으로 기억하고, 함께 만든 결과를 돌려준다.",
  m:"<b>기억하고 · 맞추고 · 부르고 · 고마워한다</b>" },
{ s:6,t:"w",q:"스타벅스 멤버십 사례로 '락인(Lock-in)'의 의미를 설명하시오.",
  k:[["못 나가게가 아니라",["못나가"]],["다음에도 여기서 하는 편이 편한",["편한","편리"]],["사이렌오더·결제·별·쿠폰·개인화",["사이렌","별","쿠폰","결제","개인화"]],["전환 비용·방문 습관",["습관","전환"]]],
  model:"락인은 고객을 못 나가게 막는 것이 아니라, 다음에도 여기서 하는 편이 편한 경험을 만드는 것이다. 스타벅스는 사이렌오더로 주문 대기 부담을 줄이고, 카드 결제와 잔액으로 결제를 익숙하게 하며, 별 등급으로 다음 보상까지의 거리를 보여주고, 쿠폰과 개인화 제안으로 다시 올 이유를 준다. 이것들이 함께 작동하면 전환 비용과 방문 습관이 쌓인다.",
  e:"정의 문장 하나만은 정확히: '못 나가게'가 아니라 '다음에도 여기서 하는 편이 편한'.",
  m:"락인 = <b>편해서 안 나가는 것</b>" },
{ s:6,t:"w",q:"멤버십, 커뮤니티, 서포터즈의 차이를 관계의 중심으로 설명하시오.",
  k:[["멤버십 = 브랜드↔회원, 혜택",["멤버십","혜택"]],["커뮤니티 = 회원↔회원",["회원과회원","회원끼리","고객끼리","회원↔회원"]],["서포터즈 = 브랜드↔참여자, 역할",["서포터즈","피드백","콘텐츠"]]],
  model:"멤버십은 브랜드와 회원 사이의 관계로 이용 기록과 혜택이 중심이다. 커뮤니티는 회원과 회원 사이의 관계로 관심사·활동·관계가 중심이다. 서포터즈는 브랜드와 참여자 사이의 관계로 체험·콘텐츠·피드백 역할이 중심이다. 셋을 거치며 고객은 혜택을 받는 사람에서 함께하는 사람으로 바뀐다.",
  e:"화살표 방향이 핵심. H.O.G.의 '어디 가지? → 우리 어디 가?'가 커뮤니티의 예.",
  m:"<b>받는 사람 → 함께하는 사람</b>" },
{ s:6,t:"w",q:"Spotify Wrapped가 고객 충성에 기여하는 방식을 쓰시오.",
  k:[["이용 기록을 자기 이야기로",["기록","자기","이야기"]],["인정받는 경험(상위 %)",["상위","인정"]],["공유 → 자발적 확산",["공유","확산"]],["매년 반복 → 기다림",["매년","반복","기다"]]],
  model:"Spotify Wrapped는 한 해의 청취 기록을 카드로 만들어, 브랜드의 데이터를 고객 자신의 이야기로 돌려준다. '상위 1% 청취자' 같은 표현으로 인정받는 경험을 주고, 공유하기 좋은 카드로 고객의 자발적 확산을 만들며, 매년 반복되어 다음 결과를 기다리게 한다. 고객의 이용기록을 자랑하고 싶은 자기 이야기로 바꿨기 때문에 떠나기 어렵게 만든다.",
  e:"충성 = 만족 위에 '나를 알아주는 관계'. Wrapped는 사회적 혜택(나를 알아줌)의 극단적 사례.",
  m:"<b>내 기록이 내 자랑이 된다</b>" },
{ s:6,t:"w",q:"Temu 사례에서 판매촉진의 위험과 교훈을 쓰시오.",
  k:[["룰렛·큰 쿠폰으로 기대",["룰렛","쿠폰","기대"]],["최소 구매액·기한·분할 사용 조건",["조건","최소","기한"]],["기대와 다르면 신뢰 하락",["신뢰"]],["실제로 쓸 수 있는 가치",["실제","쓸수"]]],
  model:"Temu는 룰렛과 큰 금액의 쿠폰팩으로 보상 기대를 만들어 상품 탐색으로 잇는다. 하지만 최소 구매액·기한·분할 사용 같은 실제 조건이 기대와 다르면 신뢰가 떨어진다. 교훈은 쿠폰 총액보다 고객이 실제로 쓸 수 있는 가치가 중요하다는 것이다.",
  e:"쿠팡이츠 배달비 0원·컬리 100원과 대비: 낮은 진입 가격 뒤에 '다음에도 선택할 이유'를 남겨야 한다.",
  m:"<b>큰 숫자보다 진짜 쓸 수 있는 숫자</b>" },
{ s:6,t:"w",q:"'같은 메시지를 자주 보내는 것이 CRM의 전부는 아니다'를 고객 상태별 메시지 예시로 설명하시오.",
  k:[["고객 상태·시점에 맞춤",["상태","시점","타이밍"]],["첫 방문: 도움·안내",["첫","안내","도움"]],["이탈 신호: 돌아올 이유",["미방문","이탈","돌아올"]],["단골: 할인보다 깊은 경험",["단골","초대","클래스"]]],
  model:"CRM은 고객 상태와 필요에 맞춰 패턴과 타이밍을 정하는 것이다. 예를 들어 가상 브랜드 '춘천 산책차'는 첫 방문 다음 날엔 집에서 우리는 법을 안내해 첫 경험을 성공시키고, 21일 미방문 고객에겐 가을 신메뉴 소식으로 돌아올 이유를 주며, 반복 구매 고객에겐 할인 대신 생산자와 함께하는 클래스에 먼저 초대해 더 깊은 경험을 준다.",
  e:"도움과 안내가 먼저, 그다음 돌아올 이유와 참여할 자리.",
  m:"<b>누구에게 · 언제 · 무엇을</b>" },
{ s:6,t:"x",q:"동네 빵집이 손님을 팬으로 만들기 위한 커뮤니케이션 전략을 인지 → 선호 → 구매 → 충성(→ 팬덤) 단계별로 제시하시오.",
  k:[["인지: 한 가지 메시지 + 매체",["인지","메시지","매체"]],["선호: 좋아할 이유를 경험(체험·클래스)",["선호","체험","경험"]],["구매: 망설임 줄이기(쿠폰·다음 버튼)",["구매","쿠폰","망설"]],["충성: CRM·관계 혜택",["충성","crm","기억","단골"]],["팬덤: 회원끼리 연결·자발적 기여",["팬","커뮤니티","모임","기여"]]],
  model:"인지 단계에서는 기억시킬 메시지 하나('아침 7시에 나오는 갓 구운 빵')를 정하고, 동네 엘리베이터 광고와 지역 SNS를 매체로 쓴다. 선호 단계에서는 오픈 베이킹 클래스로 반죽 과정을 직접 보게 해 좋아할 이유와 믿을 근거를 만든다. 구매 단계에서는 첫 방문 쿠폰과 카카오 채널 추가라는 '다음 버튼'으로 망설임을 줄인다. 충성 단계에서는 CRM으로 첫 방문 다음 날 빵 보관법을 안내하고, 단골의 취향을 기억해 신메뉴 시식에 먼저 초대한다(사회적·특별 대우 혜택). 나아가 단골끼리 만나는 주말 빵 모임을 열어 회원↔회원 관계를 만들면, 혜택이 없어도 다시 찾고 스스로 추천하는 팬덤이 된다.",
  e:"단계마다 '목표 + 구체적 수단' 한 줄씩. 마지막에 팬덤 정의로 마무리하면 고득점.",
  m:"<b>알 · 좋 · 사 · 또 → 팬</b>" },

/* ---------- 7. 종합 서술형 ---------- */
{ s:7,t:"x",q:"춘천의 오래된 막국수 골목을 로컬 브랜드로 만들려 한다. 로컬이 브랜드가 되는 조건(RESOURCE·PEOPLE·EXPERIENCE·STORY·REPEAT)을 적용해 방안을 제시하시오.",
  k:[["자원: 노포·메밀",["자원","노포","메밀"]],["사람: 노포 주인 + 청년 크리에이터",["사람","크리에이터","청년"]],["경험: 체험·투어(동선)",["경험","체험","투어","동선"]],["이야기: 노포 역사·지역 상품",["이야기","역사","상품"]],["반복: 축제·멤버십·재방문",["반복","재방문","축제","멤버십"]],["곱하기 / 해석이 KSF",["곱","해석","ksf"]]],
  model:"로컬 브랜드는 자원 × 사람 × 경험 × 이야기 × 반복으로 만들어지며, 하나라도 없으면 성립하지 않는다. 자원은 수십 년 된 막국수 노포와 메밀이다. 사람은 노포 주인과 이를 새롭게 해석할 청년 크리에이터로, 개항로처럼 노포를 배경이 아닌 공동저자로 세운다. 경험은 메밀 반죽·면 뽑기 체험과 골목 투어로, 방문이 점이 아니라 동선이 되게 한다. 이야기는 각 노포의 역사와 메밀 산지 이야기를 막국수 키트·메밀 막걸리 같은 지역 상품에 담는다. 반복은 계절 메밀 축제와 단골 멤버십으로 재방문을 만든다. 결국 자원보다 자원을 해석하고 가공하는 사람이 핵심 성공 요인이므로, 노포와 청년을 잇는 기획 거점을 가장 먼저 세운다.",
  e:"5요소를 하나씩 + 수업 사례 하나(개항로) 인용 + 결론(KSF).",
  m:"<b>자·사·경·이·반</b>, 곱하기" },
{ s:7,t:"x",q:"춘천 로컬 수제 맥주 브랜드의 이름 후보 3개를 만들고, 좋은 이름의 기준으로 비교한 뒤 최종안을 선택하시오.",
  k:[["후보 3개 제시",["후보"]],["같은 기준으로 비교(의미연상·차별·발음·기억)",["의미","차별","발음","기억"]],["소리·유형(자연어/조어, 설명/연상) 분석",["자연어","조어","설명형","연상형","격음","평음","음절"]],["최종 선택과 근거(고객·소울)",["선택","최종","고객","소울"]]],
  model:"좋은 이름은 의미연상성·차별적 개성·발음용이성·기억용이성으로 판단한다. 후보는 ① '춘천맥주'(지역 설명형) ② '호반에일'(호반의 도시 + 에일) ③ '물안개'(소양강 물안개, 자연어)다. ①은 장소가 바로 떠오르지만 흔해서 차별적 개성이 약하다. ②는 의미는 분명하지만 4음절에 외래어가 섞여 발음이 덜 매끄럽다. ③은 춘천의 아침 풍경이 떠올라 의미연상성이 높고, 3음절에 비음 ㅁ·ㄴ이 많아 부드럽게 들리며, 맥주 업계에서 드문 이름이라 구별된다. 브랜드소울을 '호반 도시의 느긋한 저녁'으로 정했으므로, 그 분위기와 소리의 인상이 가장 잘 맞는 '물안개'를 최종안으로 선택한다.",
  e:"7차시 평가 기준 '네이밍 근거 20점: 세 후보를 같은 기준으로 비교하고 골랐는가'를 그대로 적용하는 문제.",
  m:"<b>세 후보 → 같은 기준 → 고객·소울로 선택</b>" },
{ s:7,t:"x",q:"Patagonia를 5·7·8차시 개념을 연결해 분석하시오. (예: 아이덴티티·이미지·실체, 키비주얼 유형, 선호 단계)",
  k:[["5차시: 아이덴티티 vs 이미지, 약속의 증명",["아이덴티티","이미지","증명"]],["Don't Buy This Jacket / Worn Wear",["jacket","worn","수선"]],["7차시: 세계관·헤리티지형 키비주얼",["세계관","헤리티지"]],["8차시: Reality(실체)·말한 가치를 고객 행동으로",["reality","실체","행동"]],["결론: 일관성",["일관","같은방향"]]],
  model:"5차시 관점에서 Patagonia는 '환경'이라는 아이덴티티를 'Don't Buy This Jacket' 광고로 말하고, Worn Wear 수선 서비스라는 행동으로 증명해 고객의 이미지를 아이덴티티에 가깝게 만든 사례다. 7차시 관점에서 거대한 자연 속 작은 사람을 보여주는 키비주얼은 브랜드의 뿌리와 삶의 방식을 보여주는 세계관·헤리티지형이다. 8차시 관점에서 수선 서비스와 선거 참여 태그는 말한 가치를 고객이 함께하는 행동으로 바꿔 '믿을 이유'를 만드는 선호 단계의 커뮤니케이션이며, 실체(Reality)가 뒷받침되기 때문에 Identity와 Image의 교집합이 넓다. 이처럼 말·이미지·행동이 같은 방향을 가리키는 일관성이 Patagonia 브랜드의 힘이다.",
  e:"단골 사례 하나로 세 차시를 꿰는 연습. Volvo(5·6·7), Nike(5·6·8), 굿러너(3·8)로도 같은 연습을 해보자.",
  m:"Patagonia = <b>말(광고) + 행동(수선) + 장면(자연)</b>" },
{ s:7,t:"x",q:"우리 동네 러닝 모임을 오래가는 커뮤니티로, 나아가 팬덤으로 키우는 방안을 2차시 커뮤니티 조건과 8차시 팬덤 개념을 연결해 제시하시오.",
  k:[["WHY·WHO·DO·RULE·ROLE 적용",["why","who","rule","role","규칙","역할"]],["JOIN→BELONG 참여 단계",["join","belong","소속","기여"]],["반복 구조",["반복","정기","매주"]],["팬덤: 애착·공동체·자발적 참여",["애착","공동체","자발","팬"]],["사례 인용(굿러너·NRC·H.O.G.)",["굿러너","nrc","hog","h.o.g","나이키"]]],
  model:"먼저 2차시의 좋은 커뮤니티 5조건을 선명하게 한다. WHY는 '함께 달리며 건강해지기', WHO는 동네 초보~중급 러너, DO는 매주 화·목 저녁 그룹런, RULE은 '마지막 사람까지 기다리기', ROLE은 페이서·사진·코스 기획이다. 이렇게 하면 가입한 사람이 참여하고, 역할을 맡아 기여하고, '우리 모임'이라 부르는 소속 단계(JOIN → PARTICIPATE → CONTRIBUTE → BELONG)로 나아간다. 굿러너처럼 반복 활동에 하프마라톤 같은 공동 도전을 더하면 집단 기억이 쌓인다. 8차시 관점에서 팬덤은 반복 참여를 넘어 애착·공동체 의식·자발적 참여가 깊어진 관계이므로, 멤버의 기록을 연말에 Spotify Wrapped처럼 돌려주고 멤버가 직접 코스를 제안하게 하면, 혜택이 없어도 다시 오고 새 멤버를 데려오는 팬덤이 된다.",
  e:"2차시(커뮤니티 조건) + 3차시(굿러너) + 8차시(팬덤·Wrapped)를 한 답안에 연결하면 최고 점수.",
  m:"<b>와이·후·두·룰·롤 → 가입·참여·기여·소속 → 행태가 공적</b>" },
{ s:7,t:"x",q:"제민천 '마을호텔' 모델을 쇠락한 다른 원도심에 적용하려 한다. 생활인구 개념과 연결해 핵심 전략을 서술하시오.",
  k:[["생활인구 = 등록 + 체류",["생활인구","체류"]],["숙박 거점으로 체류 시작",["숙박","거점","게스트하우스","봉황재"]],["동선·관계 편집(소유보다)",["동선","편집","연결"]],["체류 이유 다양화(워케이션 등)",["워케이션","코워킹","일"]],["방문 → 체류 → 관계",["관계"]],["과제: 거버넌스·임대료",["거버넌스","임대료","과부하","균형"]]],
  model:"인구가 줄어드는 원도심은 등록인구를 늘리기 어렵지만, 등록인구와 체류인구를 합친 생활인구는 늘릴 수 있다. 제민천처럼 먼저 오래된 집을 고쳐 숙박 거점을 만들어 '머무름의 이유'를 만들고, 골목 속 안내소를 로비처럼 두어 방문객을 동네 식당·책방·상점으로 안내한다. 핵심은 공간을 모두 소유하는 것이 아니라 동선과 관계를 편집하는 것이다. 코워킹 공간을 더하면 쉬러 오는 사람에 일하러 오는 사람까지 더해져 체류 이유가 두꺼워진다. 그러면 방문은 체류가 되고 체류는 관계가 된다. 다만 커질수록 운영자 과부하, 주민–이주민 균형, 임대료 상승 같은 과제가 생기므로 거버넌스를 함께 설계해야 한다.",
  e:"제민천 핵심 문장 2개: '공간 소유가 아니라 동선과 관계의 편집', '방문은 체류가 되고 체류는 관계가 된다'.",
  m:"<b>자고 · 먹고 · 일하고 · 만나고 · 머문다</b>" },
{ s:7,t:"x",q:"강원도 로컬 식품 회사가 감자칩, 막걸리, 감자 화장품으로 사업을 넓히려 한다. 브랜드 아키텍처 전략(Branded House ~ House of Brands)을 선택하고 근거를 서술하시오.",
  k:[["아키텍처 4전략 이해",["branded","house","단일","개별","보증","하위"]],["선택한 전략",["선택"]],["신뢰 공유 vs 독립 정체성 비교",["신뢰","독립","공유"]],["업종 간 연상 충돌 고려",["화장품","충돌","다른","연상"]],["롯데·P&G 등 사례",["롯데","p&g","피앤지"]]],
  model:"브랜드 아키텍처는 여러 이름의 관계를 정하는 일로, 마스터 브랜드 하나로 가는 Branded House(롯데)부터 각자 독립하는 House of Brands(P&G)까지 스펙트럼이 있다. 감자칩과 막걸리는 '강원도 식재료'라는 같은 연상을 공유하므로 마스터 브랜드의 신뢰를 함께 쓰는 것이 유리하다. 하지만 화장품은 식품과 연상이 충돌할 수 있다. 따라서 식품은 마스터 브랜드를 앞세운 하위 브랜드 전략으로, 화장품은 마스터 브랜드가 뒤에서 보증만 하는 보증 브랜드 전략(Endorsed brands)으로 운영한다. 기존 이름의 신뢰를 어디까지 함께 쓰고 어떤 이름을 따로 키울지가 선택의 근거다.",
  e:"정답이 하나가 아닌 문제. '신뢰 공유 vs 연상 충돌'을 근거로 들면 어떤 전략이든 인정될 가능성이 높다.",
  m:"<b>단·하·보·개</b>: 같은 연상은 묶고, 충돌하면 떼어낸다" },
{ s:7,t:"x",q:"양구 지역 로컬 음료 브랜드의 BI(서체·컬러·로고 유형)를 제안하고, 각 선택의 이유를 브랜드 성격과 연결해 서술하시오.",

/* =========================================================
   상태와 채점
   ========================================================= */
Q.forEach((q, i) => { q.id = "q" + i; });
const KEY = "bl-drill-v1";
const MASTER = 2;          // 연속 2번 맞히면 외움
const REINSERT = 3;        // 틀리면 3문제 뒤 다시
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function S(id) { return st[id] || (st[id] = { box: 0, seen: 0, wrong: 0 }); }
const isMastered = q => (st[q.id] && st[q.id].box >= MASTER);
const isLearning = q => (st[q.id] && st[q.id].seen > 0 && st[q.id].box < MASTER);

const norm = s => (s || "").toLowerCase().normalize("NFC").replace(/[\s·.,()\[\]\/\-–—'"“”‘’!?:;~→←↔+×=「」『』<>]/g, "");
function gradeShort(q, ans) {
  const n = norm(ans);
  const res = q.g.map(group => group.some(alt => n.includes(norm(alt))));
  return { ok: res.every(Boolean), parts: res };
}
function checkKeys(q, ans) {
  const n = norm(ans);
  return q.k.map(([label, alts]) => ({ label, hit: alts.some(a => n.includes(norm(a))) }));
}

/* =========================================================
   화면
   ========================================================= */
const app = document.getElementById("app");
const TYPE = { s: "단답형", w: "문장형", x: "서술형" };
let sess = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }

function dday() {
  const exam = new Date(2026, 9, 27);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = Math.round((exam - now) / 86400000);
  return d > 0 ? "D-" + d : d === 0 ? "D-DAY" : "시험 종료";
}

function meterHTML(list) {
  const total = list.length;
  const m = list.filter(isMastered).length;
  const l = list.filter(isLearning).length;
  return { m, l, total, bar: `<div class="meter-bar" role="img" aria-label="외움 ${m}, 학습 중 ${l}, 전체 ${total}"><span class="mb-done" style="width:${m / total * 100}%"></span><span class="mb-half" style="width:${l / total * 100}%"></span></div>` };
}

function header() {
  const mt = meterHTML(Q);
  return `<header class="top">
    <div class="top-row">
      <div class="brand"><h1>브랜딩 로컬 기출 드릴</h1><span class="dday">${dday()}</span></div>
      <span class="sub">중간고사 10/27(화) 10시 · 1~8차시</span>
    </div>
    <div class="meter">${mt.bar}
      <div class="meter-legend"><span><i class="dot mb-done"></i>외움 ${mt.m}</span><span><i class="dot mb-half"></i>학습 중 ${mt.l}</span><span>전체 ${mt.total}문항 · 암기율 ${Math.round(mt.m / mt.total * 100)}%</span></div>
    </div>
  </header>`;
}

let confirmReset = false;
function home() {
  sess = null;
  const steps = STAGES.map(sg => {
    const list = Q.filter(q => q.s === sg.id);
    const mt = meterHTML(list);
    const done = mt.m === mt.total;
    const started = list.some(q => st[q.id] && st[q.id].seen);
    const cnt = { s: 0, w: 0, x: 0 }; list.forEach(q => cnt[q.t]++);
    const mix = [cnt.s && `단답 ${cnt.s}`, cnt.w && `문장 ${cnt.w}`, cnt.x && `서술 ${cnt.x}`].filter(Boolean).join(" · ");
    return `<div class="step${done ? " done" : ""}">
      <div class="step-no">STEP<b>${sg.id}</b></div>
      <div class="step-body">
        <div class="step-title">${sg.name}</div>
        <div class="step-meta">${sg.ses} · ${mix} · 외움 ${mt.m}/${mt.total}</div>
        ${mt.bar.replace("meter-bar", "step-bar")}
      </div>
      <button class="btn${done ? " ghost" : ""}" data-stage="${sg.id}">${done ? "다시 보기" : started ? "이어하기" : "시작"}</button>
    </div>`;
  }).join("");
  const wrongs = Q.filter(q => st[q.id] && st[q.id].wrong > 0 && !isMastered(q)).length;
  app.innerHTML = header() + `
    <section class="how" aria-label="학습 방법">
      <p><b>순서대로 STEP 1부터</b> 푸세요. 강의 순서 = 시험 범위 순서입니다.</p>
      <p>한 문제를 <b>두 번 연속 맞히면 '외움'</b>. 틀리면 풀이를 보고, <b>3문제 뒤에 다시</b> 나옵니다. 모든 문제를 외울 때까지 반복합니다.</p>
      <p>단답형은 자동 채점(한국어·영어 모두 인정), 문장형·서술형은 핵심 포인트를 자동으로 체크한 뒤 스스로 채점합니다.</p>
    </section>
    <div class="sec-label">커리큘럼</div>
    <div class="ladder">${steps}</div>
    <div class="sec-label">실전</div>
    <div class="special">
      <div class="step"><div class="step-body"><div class="step-title">오답 집중</div><div class="step-meta">틀렸고 아직 못 외운 문제 ${wrongs}개</div></div><button class="btn${wrongs ? " pen" : " ghost"}" data-mode="wrong" ${wrongs ? "" : "disabled"}>풀기</button></div>
      <div class="step"><div class="step-body"><div class="step-title">실전 모의고사</div><div class="step-meta">전 범위 무작위 · 단답 10 · 문장 4 · 서술 2</div></div><button class="btn" data-mode="mock">시작</button></div>
    </div>
    ${confirmReset
      ? `<div class="confirm"><span>모든 기록을 지울까요?</span><button class="btn pen" id="reset-yes">지우기</button><button class="btn ghost" id="reset-no">취소</button></div>`
      : `<button class="reset" id="reset">학습 기록 초기화</button>`}
  `;
  app.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => startStage(+b.dataset.stage));
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => b.dataset.mode === "mock" ? startMock() : startWrong());
  const r = document.getElementById("reset"); if (r) r.onclick = () => { confirmReset = true; home(); };
  const y = document.getElementById("reset-yes"); if (y) y.onclick = () => { st = {}; save(); confirmReset = false; home(); };
  const n = document.getElementById("reset-no"); if (n) n.onclick = () => { confirmReset = false; home(); };
  window.scrollTo(0, 0);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startStage(id) {
  const list = Q.filter(q => q.s === id);
  let pool = list.filter(q => !isMastered(q));
  const review = pool.length === 0;
  if (review) pool = list.slice();
  // 처음 보는 문제는 강의 순서대로, 학습 중인 문제가 먼저
  pool.sort((a, b) => (S(b.id).seen > 0) - (S(a.id).seen > 0));
  sess = { title: `STEP ${id} · ${STAGES[id - 1].name}`, queue: pool.map(q => q.id), log: [], review, mode: "stage" };
  next();
}
function startWrong() {
  const pool = shuffle(Q.filter(q => st[q.id] && st[q.id].wrong > 0 && !isMastered(q)));
  sess = { title: "오답 집중", queue: pool.map(q => q.id), log: [], mode: "wrong" };
  next();
}
function startMock() {
  const pick = (t, n) => shuffle(Q.filter(q => q.t === t)).slice(0, n);
  const pool = [...pick("s", 10), ...pick("w", 4), ...pick("x", 2)];
  sess = { title: "실전 모의고사", queue: pool.map(q => q.id), log: [], mode: "mock", noRequeue: true };
  next();
}

function next() {
  if (!sess.queue.length) return summary();
  const q = Q.find(x => x.id === sess.queue[0]);
  sess.cur = q; sess.answered = false;
  const s = S(q.id);
  const boxLabel = s.box >= MASTER ? "외움" : s.seen ? `연속 ${s.box}/${MASTER}` : "처음";
  const input = q.t === "s"
    ? `<input class="answer" id="ans" type="text" autocomplete="off" placeholder="답을 입력하세요 (여러 개면 쉼표로)">`
    : `<textarea class="answer${q.t === "x" ? " essay" : ""}" id="ans" placeholder="${q.t === "x" ? "정의 → 기준 → 사례 → 선택 순서로 써보세요" : "1~3문장으로 써보세요"}"></textarea>`;
  app.innerHTML = `
    <div class="qhead">
      <div class="qhead-left"><button class="back" id="back">← 목록</button><span class="qstage">${sess.title}</span></div>
      <span class="qleft">남은 ${sess.queue.length}문제 · 푼 ${sess.log.length}</span>
    </div>
    <article class="card">
      <div class="chips"><span class="chip t-${q.t}">${TYPE[q.t]}</span><span class="chip">${STAGES[q.s - 1].ses}</span><span class="chip box">${boxLabel}</span></div>
      <p class="qtext">${esc(q.q)}${q.t === "s" ? "<small>영어·한국어 어느 쪽으로 써도 뜻이 맞으면 정답</small>" : ""}</p>
      ${input}
      <div class="actions">
        <button class="btn" id="submit">${q.t === "s" ? "채점" : "답안 제출"}</button>
        <button class="btn ghost" id="idk">모르겠음 · 풀이 보기</button>
      </div>
      <p class="hint">${q.t === "s" ? "Enter로 채점" : "Ctrl+Enter로 제출"}</p>
    </article>
    <div id="fb"></div>`;
  const ans = document.getElementById("ans");
  ans.focus({ preventScroll: true });
  document.getElementById("back").onclick = home;
  document.getElementById("submit").onclick = () => submit(ans.value, false);
  document.getElementById("idk").onclick = () => submit(ans.value, true);
  ans.addEventListener("keydown", e => {
    if (e.key === "Enter" && (q.t === "s" ? !e.isComposing : (e.ctrlKey || e.metaKey))) { e.preventDefault(); if (!sess.answered) submit(ans.value, false); else document.getElementById("nextBtn")?.click(); }
  });
  window.scrollTo(0, 0);
}

function submit(val, gaveUp) {
  if (sess.answered) return;
  sess.answered = true;
  const q = sess.cur;
  document.getElementById("submit").disabled = true;
  document.getElementById("idk").disabled = true;
  document.getElementById("ans").readOnly = true;
  const fb = document.getElementById("fb");
  if (q.t === "s") {
    const r = gaveUp ? { ok: false } : gradeShort(q, val);
    record(r.ok);
    fb.innerHTML = feedbackShort(q, r.ok, val, gaveUp);
    bindNext();
  } else {
    const keys = checkKeys(q, gaveUp ? "" : val);
    const hit = keys.filter(k => k.hit).length;
    const ratio = hit / keys.length;
    fb.innerHTML = feedbackLong(q, keys, hit, ratio, gaveUp);
    if (gaveUp) { record(false); bindNext(); }
    else {
      document.getElementById("sg-ok").onclick = () => { record(true); lockSelf("정답 처리했습니다."); };
      document.getElementById("sg-no").onclick = () => { record(false); lockSelf("다시 공부할 문제로 표시했습니다."); };
    }
  }
  fb.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function lockSelf(msg) {
  const sg = document.getElementById("selfgrade");
  sg.innerHTML = `<p>${msg}</p><div class="actions"><button class="btn" id="nextBtn">다음 문제 →</button></div>`;
  bindNext();
}

function record(ok) {
  const q = sess.cur, s = S(q.id);
  s.seen++;
  if (ok) s.box = Math.min(s.box + 1, MASTER + 1); else { s.box = 0; s.wrong++; }
  save();
  sess.log.push({ id: q.id, ok });
  sess.queue.shift();
  if (!sess.noRequeue) {
    if (!ok) sess.queue.splice(Math.min(REINSERT, sess.queue.length), 0, q.id);
    else if (s.box < MASTER) sess.queue.push(q.id);   // 한 번 더 확인해야 외움
  }
}

function bindNext() {
  const b = document.getElementById("nextBtn");
  if (b) { b.onclick = next; b.focus({ preventScroll: true }); }
}

function feedbackShort(q, ok, val, gaveUp) {
  const s = S(q.id);
  const status = ok ? (s.box >= MASTER ? "외움 완료!" : "한 번 더 맞히면 외움") : (sess.noRequeue ? "오답 노트에 추가" : "3문제 뒤에 다시 나옵니다");
  return `<section class="fb ${ok ? "right" : "wrong"}" aria-live="polite">
    <div class="verdict">${ok ? "정답 ○" : gaveUp ? "풀이 보기" : "오답 ✕"}</div>
    <div class="fb-row"><span class="fb-k">정답</span><span class="fb-ans">${esc(q.a)}</span></div>
    ${!ok && !gaveUp && val.trim() ? `<p class="yours">내 답: <s>${esc(val)}</s></p>` : ""}
    <div class="fb-row"><span class="fb-k">풀이</span><p>${esc(q.e)}</p></div>
    <div class="mem">🧠 ${q.m}</div>
    <p class="hint">${status}</p>
    <div class="actions"><button class="btn" id="nextBtn">다음 문제 →</button></div>
  </section>`;
}

function feedbackLong(q, keys, hit, ratio, gaveUp) {
  const sugg = ratio >= 0.6 ? "핵심 포인트를 대부분 썼습니다. 예시 답안과 비교해 보고 정답 처리하세요."
    : ratio >= 0.34 ? "일부 포인트가 빠졌습니다. 빠진 포인트를 확인하세요."
    : "핵심 포인트가 많이 빠졌습니다. 예시 답안을 읽고 다시 풀어보길 권합니다.";
  const list = keys.map(k => `<li class="${k.hit ? "hit" : "miss"}"><span class="mk">${k.hit ? "✓" : "✕"}</span><span>${esc(k.label)}</span></li>`).join("");
  return `<section class="fb ${gaveUp ? "wrong" : ratio >= 0.6 ? "right" : ""}" aria-live="polite">
    <div class="verdict">${gaveUp ? "풀이 보기" : `포인트 ${hit}/${keys.length}`}</div>
    <div class="fb-row"><span class="fb-k">채점 포인트 ${gaveUp ? "" : "(내 답에서 자동 확인)"}</span><ul class="kp">${list}</ul></div>
    <div class="fb-row"><span class="fb-k">예시 답안</span><p class="model">${esc(q.model)}</p></div>
    <div class="fb-row"><span class="fb-k">풀이</span><p>${esc(q.e)}</p></div>
    <div class="mem">🧠 ${q.m}</div>
    ${gaveUp
      ? `<p class="hint">${sess.noRequeue ? "오답 노트에 추가" : "3문제 뒤에 다시 나옵니다"}</p><div class="actions"><button class="btn" id="nextBtn">다음 문제 →</button></div>`
      : `<div class="selfgrade" id="selfgrade"><p>${sugg} 자동 체크는 키워드 기준이라, 같은 뜻을 다른 말로 썼다면 직접 판단하세요.</p>
          <div class="actions"><button class="btn ok" id="sg-ok">맞았다 (정답 처리)</button><button class="btn pen" id="sg-no">다시 공부</button></div></div>`}
  </section>`;
}

function summary() {
  const n = sess.log.length;
  const ok = sess.log.filter(l => l.ok).length;
  const ids = [...new Set(sess.log.filter(l => !l.ok).map(l => l.id))];
  const wrongList = ids.map(id => { const q = Q.find(x => x.id === id); return `<div><span>${esc(q.q)}</span><span class="chip t-${q.t}">${TYPE[q.t]}</span></div>`; }).join("");
  const title = sess.mode === "mock" ? `${ok} / ${n}` : sess.review ? "복습 완료" : "STEP 완료";
  app.innerHTML = header() + `
    <section class="sum">
      <div class="sec-label">${esc(sess.title)}</div>
      <div class="sum-big">${title}</div>
      <p>${sess.mode === "mock"
        ? `${n}문제 중 ${ok}문제를 맞혔습니다. 틀린 문제는 '오답 집중'에서 다시 풀 수 있습니다.`
        : `총 ${n}번 풀어서 이 범위의 문제를 모두 두 번 연속 맞혔습니다.${ids.length ? ` 중간에 틀렸던 문제 ${ids.length}개는 시험 전에 한 번 더 보세요.` : ""}`}</p>
      ${ids.length ? `<div class="sec-label">틀렸던 문제</div><div class="sum-list">${wrongList}</div>` : ""}
      <div class="actions"><button class="btn" id="homeBtn">커리큘럼으로</button></div>
    </section>`;
  document.getElementById("homeBtn").onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
